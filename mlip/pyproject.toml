[project]
name = "rmcph-mlip"
version = "0.1.0"
description = "MLIP-based phonon band structure and dynamical matrix calculator for RMC Phonon Dynamics"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ase>=3.23.0",
    "mace-torch>=0.3.10",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "phonopy>=2.28.0",
    "scipy>=1.12.0",
    "seekpath>=2.1.0",
    "spglib>=2.3.0",
]

[project.scripts]
rmcph-mlip = "rmcph_mlip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rmcph_mlip"]
